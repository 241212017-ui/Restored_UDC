seed: 42
data:
  train_root: D:/UDC_AMFM_Project/data/Train
  mat_root: D:/UDC_AMFM_Project/data
  train_datasets: [Poled, Toled]
  eval_datasets: [poled, toled]
  crop: [512, 1024]
  val_crop: [256, 512]
  augment: true
model:
  width: 48
  levels: 3
  fusion: amfm
  num_drb: 2
train:
  batch_size: 1
  iterations: 2000
  lr: 0.00003
  min_lr: 0.000001
  warmup: 100
  weight_decay: 0.0
  amp: true
  num_workers: 2
  val_every: 500
  log_every: 25
  grad_clip: 1.0
  lambda_pyramid: 0.5
output:
  root: D:/UDC_AMFM_Project/outputs
